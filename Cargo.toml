[package]
name = "reika-escpos"
version = "2.0.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23"
log = "0.4.29"
escpos = { version = "0.20.1", features = ["barcodes", "codes_2d", "usb"] }
rusb = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
warp = { version = "0.4.3", features = ["server", "test"] }

# GUI
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"

# System tray
tray-icon = "0.26.1"

# Config file
toml = "1.1.0"

# Timestamps for log
chrono = { version = "0.4.42", features = ["serde"] }

# Notifications (Windows toast notifications)
notify-rust = "4.18.2"

# HTTP client for sensor reporting to REIKA
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_Usb",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
