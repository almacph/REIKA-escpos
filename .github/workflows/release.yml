name: Build and Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 pkg-config libgtk-3-dev libxdo-dev
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Locked compile and lint gates
        run: cargo check --locked && cargo clippy --locked --all-targets -- -D warnings
      - name: Native unit and contract tests
        run: cargo test --locked
      - name: Windows compile and test gates
        run: cargo check --locked --target x86_64-pc-windows-gnu && cargo test --locked --target x86_64-pc-windows-gnu --no-run
      - name: Dependency duplicate and license/advisory gates
        run: |
          cargo tree --locked --duplicates
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          cargo audit
          cargo deny check

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Run native Windows tests
        run: cargo test --locked
      - name: Validate watchdog VBScript on Windows
        run: cscript //nologo reika-watchdog.vbs --self-test

  build:
    needs: [checks, windows-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW and zip
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Build Windows executable
        run: chmod +x build-windows.sh scripts/release-manifest.sh && ./build-windows.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reika-escpos-windows
          path: |
            target/x86_64-pc-windows-gnu/release/reika-escpos.zip
            target/x86_64-pc-windows-gnu/release/reika-escpos.provenance.json

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: reika-escpos-windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            reika-escpos.zip
            reika-escpos.provenance.json
          generate_release_notes: true
